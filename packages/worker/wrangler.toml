name = "vigia"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "vigia"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
